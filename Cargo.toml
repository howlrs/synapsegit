[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/howlrs/synapsegit"
rust-version = "1.88"
publish = false

[workspace.dependencies]
askama = "=0.16.0"
axum = "=0.8.9"
getrandom = "0.4.3"
jsonschema = { version = "0.47.0", default-features = false }
mime = "0.3.17"
rusqlite = "=0.39.0"
rustix = "1.1.4"
serde = "1.0.228"
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
tokio = "=1.52.3"
toml = "=1.1.4"
tower = "0.5.3"
unicode-normalization = "0.1.24"

[workspace.lints.rust]
warnings = "deny"
