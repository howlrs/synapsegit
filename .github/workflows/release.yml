name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-ci:
    name: Require successful main CI for the tagged commit
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Wait for the main CI result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/wait_for_main_ci.mjs --self-test
          node scripts/wait_for_main_ci.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"

  build:
    name: Verify, build, and package ${{ matrix.target }}
    needs: main-ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.88.0
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release source
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate tag and package versions
        run: bash scripts/verify_release_version.sh "$GITHUB_REF_NAME"

      - name: Install the release toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          if [[ "$RUNNER_OS" == macOS ]]; then
            command -v gtar >/dev/null || brew install gnu-tar
          fi

      - name: Verify the tagged source
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
          node scripts/compare_creator_reports.mjs --self-test
          node scripts/select_archive_compat_baseline.mjs --self-test
          node scripts/verify_byte_identity_allowlist.mjs --self-test
          node scripts/verify_byte_identity_allowlist.mjs
          node scripts/test_release_version.mjs
          node scripts/test_verify_release_attestation.mjs
          node scripts/verify_release_fixtures.mjs --self-test
          node scripts/verify_release_fixtures.mjs
          node scripts/verify_core_fixtures.mjs
          node scripts/verify_local_api.mjs
          node scripts/test_publication_comprehension_scorer.mjs
          node scripts/verify_docs.mjs
          node scripts/verify_license.mjs
          node scripts/generate_third_party_notices.mjs --check
          node scripts/verify_mermaid.mjs
          node scripts/manage_github_security.mjs --validate
          git diff --check

      - name: Verify the tagged source on macOS
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build release binaries
        run: |
          cargo build --release --locked -p synapse-cli --bin synapse
          cargo build --release --locked -p synapse-local-http --bin synapse-local
          cargo build --release --locked -p synapse-publication --bin synapse-present

      - name: Verify archive compatibility baselines
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: CARGO_NET_OFFLINE=false bash scripts/verify_archive_compatibility.sh target/release/synapse

      - name: Package release archive
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          bash scripts/package_release.sh "$GITHUB_REF_NAME" "$TARGET" dist

      - name: Smoke-test the packaged archive
        run: bash scripts/smoke_release_archive.sh "dist/synapsegit-$GITHUB_REF_NAME-$TARGET.tar.gz" "$GITHUB_REF_NAME" "$TARGET"

      - name: Attest the release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/synapsegit-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz

      - name: Keep the release archive for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release assets
    needs: build
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.release-kind.outputs.prerelease }}
      latest: ${{ steps.release-kind.outputs.latest }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Classify release publication
        id: release-kind
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

      - name: Collect the platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-parts

      - name: Combine and verify the checksums
        run: |
          bash scripts/assemble_release_assets.sh release-parts dist
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS)" -eq 2
          test -f "dist/synapsegit-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz"
          test -f "dist/synapsegit-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz"

      - name: Create or resume the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.release-kind.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.release-kind.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              --draft \
              --prerelease="$RELEASE_PRERELEASE"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              --draft \
              --prerelease="$RELEASE_PRERELEASE"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ steps.release-kind.outputs.prerelease }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "$RELEASE_PRERELEASE"
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ steps.release-kind.outputs.prerelease }}
          RELEASE_LATEST: ${{ steps.release-kind.outputs.latest }}
        run: |
          release_flags=("--prerelease=$RELEASE_PRERELEASE" "--latest=$RELEASE_LATEST")
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            "${release_flags[@]}"

  post-publish-verify:
    name: Verify published ${{ matrix.target }} release archive
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download and verify the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          EXPECTED_PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          EXPECTED_LATEST: ${{ needs.publish.outputs.latest }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d "${TMPDIR:-/tmp}/synapsegit-release-verify.XXXXXX")"
          trap 'rm -rf -- "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$verify_dir" \
            --pattern 'synapsegit-*.tar.gz' \
            --pattern SHA256SUMS
          cd "$verify_dir"
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "$EXPECTED_PRERELEASE"
          if [[ "$EXPECTED_LATEST" == true ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$GITHUB_REF_NAME"
          fi

          expected_linux="synapsegit-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz"
          expected_macos="synapsegit-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz"
          expected_archives="$(printf '%s\n' "$expected_linux" "$expected_macos" | sort)"
          shopt -s nullglob
          downloaded_archives=(synapsegit-*.tar.gz)
          downloaded_files=(*)
          test "${#downloaded_archives[@]}" -eq 2
          test "${#downloaded_files[@]}" -eq 3
          actual_archives="$(printf '%s\n' "${downloaded_archives[@]}" | sort)"
          test "$actual_archives" = "$expected_archives"
          test "$(wc -l < SHA256SUMS)" -eq 2
          actual_checksums="$(awk '
            NF != 2 || length($1) != 64 || $1 ~ /[^0-9a-f]/ || $2 ~ /\// { exit 1 }
            { print $2 }
          ' SHA256SUMS | sort)"
          test "$actual_checksums" = "$expected_archives"
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 --check SHA256SUMS
          else
            sha256sum --check SHA256SUMS
          fi

          archive="synapsegit-$GITHUB_REF_NAME-$TARGET.tar.gz"
          digest="$(awk -v archive="$archive" '$2 == archive { print $1 }' SHA256SUMS)"
          test -n "$digest"
          gh attestation verify "$archive" \
            --repo howlrs/synapsegit \
            --signer-workflow howlrs/synapsegit/.github/workflows/release.yml \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > attestation.json
          node "$GITHUB_WORKSPACE/scripts/verify_release_attestation.mjs" \
            attestation.json "$archive" "$digest" "$GITHUB_REF_NAME"
          bash "$GITHUB_WORKSPACE/scripts/smoke_release_archive.sh" \
            "$archive" "$GITHUB_REF_NAME" "$TARGET"
