name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests and other refs cancel superseded runs. Each main commit gets its
# own group and is never cancelled, because a release tag requires the main CI
# result of its exact commit (scripts/wait_for_main_ci.mjs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Rust, protocol, and documentation
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify Rust formatting, tests, lint, and docs
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo test --workspace --doc --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Verify protocol and documentation contracts
        env:
          LOCAL_API_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          for script in scripts/*.mjs; do node --check "$script"; done
          bash -n scripts/*.sh
          node scripts/compare_creator_reports.mjs --self-test
          node scripts/select_archive_compat_baseline.mjs --self-test
          node scripts/verify_byte_identity_allowlist.mjs --self-test
          node scripts/verify_byte_identity_allowlist.mjs
          node scripts/verify_core_fixtures.mjs
          node scripts/verify_local_api.mjs
          node scripts/test_local_api_version.mjs
          node scripts/test_local_app.mjs
          node scripts/test_publication_comprehension_scorer.mjs
          node scripts/verify_docs.mjs
          node scripts/test_verify_docs.mjs
          node scripts/verify_workspace_diagrams.mjs
          node scripts/test_verify_workspace_diagrams.mjs
          node scripts/verify_license.mjs
          node scripts/generate_third_party_notices.mjs --check
          node scripts/verify_mermaid.mjs
          node scripts/manage_github_security.mjs --validate
          node scripts/wait_for_main_ci.mjs --self-test
          node scripts/test_release_version.mjs
          node scripts/verify_release_fixtures.mjs --self-test
          node scripts/verify_release_fixtures.mjs
          git diff --check

      - name: Verify localhost browser workflows in Chromium
        run: |
          cargo build --release -p synapse-cli -p synapse-local-http --locked
          npm ci --prefix scripts/browser --ignore-scripts
          scripts/browser/node_modules/.bin/playwright install --with-deps chromium
          SYNAPSEGIT_BROWSER_PROFILE=release npm --prefix scripts/browser test -- --workers=2

      - name: Verify archive compatibility baselines
        run: CARGO_NET_OFFLINE=false bash scripts/verify_archive_compatibility.sh target/release/synapse

      - name: Verify the archive tutorial bundle
        run: |
          cargo build -p synapse-cli -p synapse-local-http -p synapse-publication --locked
          bash scripts/test_tutorial_bundle.sh \
            target/debug/synapse \
            target/debug/synapse-local \
            target/debug/synapse-present

      - name: Package and verify the release archive
        run: |
          cargo build --release -p synapse-cli -p synapse-local-http -p synapse-publication --locked
          target="$(rustc -vV | awk '$1 == "host:" { print $2 }')"
          version="$(cargo metadata --no-deps --format-version 1 | node -e 'const packages = JSON.parse(require("fs").readFileSync(0, "utf8")).packages; const pkg = packages.find(({ name }) => name === "synapse-cli"); if (!pkg) throw new Error("synapse-cli is missing from cargo metadata"); process.stdout.write(pkg.version)')"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package_release.sh "v$version" "$target" release-dist
          (cd release-dist && sha256sum --check SHA256SUMS)
          bash scripts/smoke_release_archive.sh "release-dist/synapsegit-v$version-$target.tar.gz" "v$version" "$target"

      - name: Keep the Linux release archive for assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-x86_64-unknown-linux-gnu
          path: |
            release-dist/*.tar.gz
            release-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  macos-arm64:
    name: macOS arm64 build, tests, and release archive
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the Rust toolchain and GNU tar
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          command -v gtar >/dev/null || brew install gnu-tar

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify Rust tests and lint on macOS
        run: |
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Package and verify the macOS release archive
        run: |
          cargo build --release -p synapse-cli -p synapse-local-http -p synapse-publication --locked
          target="$(rustc -vV | awk '$1 == "host:" { print $2 }')"
          test "$target" = aarch64-apple-darwin
          version="$(cargo metadata --no-deps --format-version 1 | node -e 'const packages = JSON.parse(require("fs").readFileSync(0, "utf8")).packages; const pkg = packages.find(({ name }) => name === "synapse-cli"); if (!pkg) throw new Error("synapse-cli is missing from cargo metadata"); process.stdout.write(pkg.version)')"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package_release.sh "v$version" "$target" release-dist
          (cd release-dist && shasum -a 256 --check SHA256SUMS)
          bash scripts/smoke_release_archive.sh "release-dist/synapsegit-v$version-$target.tar.gz" "v$version" "$target"

      - name: Keep the macOS release archive for assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aarch64-apple-darwin
          path: |
            release-dist/*.tar.gz
            release-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release-assembly:
    name: Assemble the multi-platform release assets
    needs: [verify, macos-arm64]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-parts

      - name: Combine and verify the checksums
        run: |
          bash scripts/assemble_release_assets.sh release-parts release-assets
          ls release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 2
