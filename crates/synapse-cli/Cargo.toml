[package]
name = "synapse-cli"
version = "1.2.0"
description = "Stage 0 command-line interface for SynapseGit Core"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
synapse-canonical = { path = "../synapse-canonical" }
synapse-core = { path = "../synapse-core" }
synapse-creator = { path = "../synapse-creator" }
synapse-sqlite = { path = "../synapse-sqlite" }
synapse-local-http = { path = "../synapse-local-http" }
synapse-publication = { path = "../synapse-publication" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
