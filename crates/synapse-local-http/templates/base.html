<!doctype html>
<html lang="{{ m.locale.code() }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="synapse-local-token" content="{{ token }}">
    <meta name="synapse-api-base" content="/api/v1">
    <title>{{ page_title }} · SynapseGit Local</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">{{ m.common.skip_link }}</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">SG</span>
          <span>SynapseGit Local</span>
        </a>
        <div class="site-header__navs">
          <nav class="primary-nav" aria-label="{{ m.common.primary_nav }}">
            <ul><li><a href="/">{{ m.common.nav_projects }}</a></li></ul>
          </nav>
          <nav class="language-switch" aria-label="{{ m.common.language_nav }}">
            <ul>
              <li><a href="?lang=ja" lang="ja" hreflang="ja"{% if m.locale.is_ja() %} aria-current="page"{% endif %}>日本語</a></li>
              <li><a href="?lang=en" lang="en" hreflang="en"{% if m.locale.is_en() %} aria-current="page"{% endif %}>English</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <main id="main" class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
