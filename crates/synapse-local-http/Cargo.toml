[package]
name = "synapse-local-http"
version = "0.5.0"
description = "Loopback-only HTTP and UI transport for the SynapseGit local application"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "synapse-local"
path = "src/main.rs"

[dependencies]
askama.workspace = true
axum = { workspace = true, features = ["multipart"] }
getrandom.workspace = true
mime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_urlencoded.workspace = true
synapse-local-service = { path = "../synapse-local-service" }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
synapse-creator = { path = "../synapse-creator" }
tower = { workspace = true, features = ["util"] }
