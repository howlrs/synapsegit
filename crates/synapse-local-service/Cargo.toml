[package]
name = "synapse-local-service"
version = "1.1.0"
description = "Transport-neutral trusted facade for the SynapseGit localhost application"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
synapse-core = { path = "../synapse-core" }
synapse-creator = { path = "../synapse-creator" }
synapse-sqlite = { path = "../synapse-sqlite" }
synapse-publication = { path = "../synapse-publication" }
