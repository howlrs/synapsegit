[package]
name = "synapse-artifact"
version = "0.5.0"
description = "Provider-neutral regular-file artifact mapping for SynapseGit"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
synapse-application = { path = "../synapse-application" }
synapse-artifact-journal = { path = "../synapse-artifact-journal" }
synapse-canonical = { path = "../synapse-canonical" }
synapse-core = { path = "../synapse-core" }
synapse-schema = { path = "../synapse-schema" }
synapse-sqlite = { path = "../synapse-sqlite" }
unicode-normalization.workspace = true

[dev-dependencies]
jsonschema.workspace = true
